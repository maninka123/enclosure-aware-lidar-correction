[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-dome-correction"
version = "0.1.0"
description = "Spherical dome refraction experiments and LiDAR point-cloud correction"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "matplotlib>=3.6"]

[project.scripts]
dome-correct = "dome_correction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
